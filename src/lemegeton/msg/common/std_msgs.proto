syntax = "proto3";

package lemegeton.common.std_msgs;

import "google/protobuf/empty.proto";

message Bool {
  bool value = 1;
}

message String {
    string value = 1;
}

message Int{
    int32 value = 1;
}

message Float{
    float value = 1;
}

message Double{
    double value = 1;
}

message Empty{
    google.protobuf.Empty value = 1;
}