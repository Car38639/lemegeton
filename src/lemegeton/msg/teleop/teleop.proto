syntax = "proto3";

package lemegeton.teleop;

import "google/protobuf/timestamp.proto";
import "lemegeton/msg/common/manipulator.proto";
import "lemegeton/msg/common/geometry.proto";



message TeleopHeader {
    google.protobuf.Timestamp timestamp = 1;
    uint32 frame_id = 2;
    string device_type = 3;
    repeated string activated_joints = 4;
    bool enable_dexterous = 5;
}

message TeleopData {
    // 1. Header
    TeleopHeader header = 1;
    
    // --- Base ---
    lemegeton.common.geometry.Pose pelvis = 2;        
    lemegeton.common.geometry.Pose waist = 3;
    lemegeton.common.geometry.Pose torso = 4;

    // --- Head ---
    lemegeton.common.geometry.Pose neck = 5;
    lemegeton.common.geometry.Pose head = 6;

    // --- Left Upper Body ---
    lemegeton.common.geometry.Pose left_shoulder = 7;
    lemegeton.common.geometry.Pose left_elbow = 8;
    lemegeton.common.geometry.Pose left_wrist = 9;
    lemegeton.common.geometry.Pose left_hand = 10;    // 手掌根部 (Hand Root)

    // --- Right Upper Body ---
    lemegeton.common.geometry.Pose right_shoulder = 11;
    lemegeton.common.geometry.Pose right_elbow = 12;
    lemegeton.common.geometry.Pose right_wrist = 13;
    lemegeton.common.geometry.Pose right_hand = 14;   // 手掌根部 (Hand Root)

    // --- Left Lower Body ---
    lemegeton.common.geometry.Pose left_hip = 15;
    lemegeton.common.geometry.Pose left_knee = 16;
    lemegeton.common.geometry.Pose left_ankle = 17;
    lemegeton.common.geometry.Pose left_foot = 18;
    lemegeton.common.geometry.Pose left_toe = 19;

    // --- Right Lower Body ---
    lemegeton.common.geometry.Pose right_hip = 20;
    lemegeton.common.geometry.Pose right_knee = 21;
    lemegeton.common.geometry.Pose right_ankle = 22;
    lemegeton.common.geometry.Pose right_foot = 23;
    lemegeton.common.geometry.Pose right_toe = 24;

    // --- Dexterous Hands ---
    repeated lemegeton.common.geometry.Pose left_dexterous = 25; 
    repeated lemegeton.common.geometry.Pose right_dexterous = 26;
}