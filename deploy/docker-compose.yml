services:
  lemegeton-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lemegeton-gateway
    container_name: lemegeton-gateway
    restart: always
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ..:/root/workspace/
    ipc: "host"
    privileged: true
    working_dir: /root/workspace
    env_file:
      - path: .env
        required: false
    command: >
      bash -c "
        python3 deploy/main.py"