[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lemegeton"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Awen Hunag", email = "awen_huang@solomon-3d.com" }
]
# 專案運行所需的第三方套件
dependencies = ["protobuf", "pyzmq", "redis"]

[project.optional-dependencies]
# protobuf 編譯工具 (內建 protoc 與 google/protobuf well-known types)
build = ["grpcio-tools"]

[project.scripts]
lemegeton = "lemegeton.cli:main"
compile_protos = "lemegeton.compile_protos:main"  # 向後相容 (等同 lemegeton compile)

[tool.setuptools]
package-dir = { "" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lemegeton*"]

[tool.setuptools.package-data]
"lemegeton" = ["*.sh"]
"lemegeton.msg" = ["*.*", "**/*.*"]

# --- 其他常見工具設定 ---

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
known_first_party = ["lemegeton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]